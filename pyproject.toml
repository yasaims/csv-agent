[project]
name = "csv-agent"
version = "0.1.0"
description = "Sample agent that answers questions about a single small CSV file with a local Ollama model"
readme = "README.md"
authors = [
    { name = "yasaims", email = "" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "ollama>=0.6.3",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]

[project.scripts]
csv-agent = "csv_agent.cli:main"
csv-agent-eval = "csv_agent.evaluation:main"
csv-agent-eval-check = "csv_agent.eval_records:check_main"
csv-agent-gui = "csv_agent.gui.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ollama'"
markers = [
    "ollama: semantic tests that call a real local Ollama server",
    "gui: browser tests of the web GUI (headless Chromium via Playwright)",
]
